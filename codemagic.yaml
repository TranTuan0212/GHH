workflows:
  ios-app-release:
    name: iOS SloMo 240fps Live Stream App
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        XCODE_PROJECT: "ios/SloMoLive.xcodeproj"
        XCODE_SCHEME: "SloMoLive"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install CocoaPods dependencies
        script: |
          set -e
          echo "=== COMMIT=$(git rev-parse --short HEAD) ==="
          echo "=== YAML_DEBUG_START ==="
          sed -n '1,40p' codemagic.yaml
          echo "=== YAML_DEBUG_END ==="
          cd ios
          ls -la Podfile
          pod install --repo-update 2>&1 | tee $HOME/pod_install.log
          ls -la SloMoLive.xcworkspace || echo "WORKSPACE_MISSING"
      - name: Build iOS Application (.app)
        script: |
          set -e
          echo "=== Building with workspace ==="
          cd ios
          ls -la SloMoLive.xcworkspace
          xcodebuild build \
            -workspace SloMoLive.xcworkspace \
            -scheme SloMoLive \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Package .app into .ipa file
        script: |
          APP_PATH=$(find $HOME/Library/Developer/Xcode/DerivedData -name "SloMoLive.app" | head -n 1)
          echo "Found app at: $APP_PATH"
          if [ -d "$APP_PATH" ]; then
            mkdir -p $HOME/export/Payload
            cp -r "$APP_PATH" $HOME/export/Payload/
            cd $HOME/export
            zip -r SloMoLive.ipa Payload
            echo "Successfully created SloMoLive.ipa"
          else
            echo "Error: Could not locate SloMoLive.app"
            exit 1
          fi
    artifacts:
      - $HOME/export/SloMoLive.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.app
